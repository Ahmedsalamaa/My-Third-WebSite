<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a0207">
  <title>Wedding Invitation</title>
  <meta name="description" content="You are invited">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/media/stage.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link id="fontsLink" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Corinthia:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Gilda+Display&family=Albert+Sans:wght@500;600&display=swap">
  <link rel="stylesheet" href="assets/css/invite.css?v=20261127b">
  <link rel="preload" as="image" href="assets/media/glitter.jpg">
</head>
<body class="is-locked">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="goldG" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#d9b47c" class="g1"/><stop offset=".55" stop-color="#fff4dc"/><stop offset="1" stop-color="#f3dcae" class="g2"/>
      </linearGradient>
    </defs>
  </svg>

  <!-- ============ GLITTER COVER ============ -->
  <div class="cover" id="cover" role="button" tabindex="0" aria-label="Tap to open the invitation">
    <div class="cover__bg" id="coverBg" data-bg="intro.glitterImage"></div>
    <canvas class="cover__glitter" id="glitter" aria-hidden="true"></canvas>
    <div class="cover__veil"></div>
    <div class="cover__ui">
      <div class="cover__top">
        <p class="cover__hint" data-text="intro.hint"></p>
        <p class="cover__mono" data-text="intro.monogram"></p>
      </div>
      <div class="cover__bottom">
        <p class="cover__action" id="coverAction"></p>
        <p class="cover__alt" id="coverAlt"></p>
        <div class="cover__meter" id="meter" hidden><i id="meterFill"></i></div>
        <button class="cover__mic" id="micBtn" type="button" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
          <span data-text="intro.micLabel"></span>
        </button>
      </div>
    </div>
  </div>

  <!-- Optional opening film (dashboard → Opening → Opening video) -->
  <div class="film" id="film" hidden>
    <video id="filmVideo" muted playsinline webkit-playsinline preload="auto" disablepictureinpicture></video>
    <button class="film__skip" id="filmSkip" type="button">Skip ›</button>
  </div>

  <canvas class="stars" id="stars" aria-hidden="true"></canvas>

  <!-- "scroll down" cue: a pearl gliding down a thin gold thread -->
  <div class="cue" id="cue" aria-hidden="true">
    <span class="cue__text" data-text="hero.scrollHint"></span>
    <span class="cue__line"><i class="cue__pearl"></i></span>
    <span class="cue__chev"></span>
  </div>

  <main id="main">
    <!-- ============ STAGE ============ -->
    <section class="hero" id="hero">
      <div class="hero__stage">
        <img class="hero__img" id="stageImg" data-src="hero.stageImage" alt="">
        <video class="hero__film" id="heroFilm" muted playsinline webkit-playsinline preload="auto" disablepictureinpicture aria-hidden="true"></video>
        <div class="hero__beam" id="beam"></div>
        <div class="hero__ring" id="ring"></div>
        <canvas class="hero__dust" id="dust" aria-hidden="true"></canvas>
        <div class="hero__shade"></div>
      </div>
      <div class="curtain curtain--l" id="curtainL"><div class="curtain__tex"></div></div>
      <div class="curtain curtain--r" id="curtainR"><div class="curtain__tex"></div></div>

      <div class="hero__text">
        <p class="hero__eyebrow" data-type="hero.eyebrow"></p>
        <h1 class="hero__names">
          <span class="script hero__name" data-type="hero.name1"></span>
          <span class="hero__amp" data-type="hero.ampersand"></span>
          <span class="script hero__name" data-type="hero.name2"></span>
        </h1>
        <p class="hero__invite" data-type="hero.invite"></p>
        <p class="hero__date" data-type="hero.dateLine"></p>
        <p class="hero__place" data-type="hero.place"></p>
      </div>
    </section>

    <!-- ============ LETTER ============ -->
    <section class="silk-sec letter" id="letter" data-section="letter">
      <div class="silk-sec__bg" data-bg="letter.background"></div>
      <div class="letter__sticky">
        <div class="env" id="env">
          <img class="env__back" data-src="letter.envelope" alt="">
          <article class="paper card letter__card" id="letterCard">
            <img class="letter__pin" data-src="letter.pin" alt="">
            <h2 class="script title ink" data-text="letter.title"></h2>
            <p class="paper__text" data-text="letter.text"></p>
            <p class="script letter__sig ink" data-text="letter.signature"></p>
          </article>
          <img class="env__front" data-src="letter.envelope" alt="">
        </div>
      </div>
    </section>

    <!-- ============ SAVE THE DATE: turning calendar pages ============ -->
    <section class="flip" id="flip" data-section="event">
      <div class="flip__sticky">
        <h2 class="script title" data-text="event.title"></h2>
        <p class="subtitle" data-text="event.subtitle"></p>
        <div class="pad">
          <img class="pad__pearls" data-src="event.pearls" alt="">
          <div class="pad__head caps" data-text="event.padLabel"></div>
          <div class="pad__pages" id="pages"></div>
        </div>
        <!-- appears under the calendar once the wedding month is reached (like the original) -->
        <div class="when">
          <p class="when__date" data-text="event.dateText"></p>
          <p class="when__note" data-text="event.timeText"></p>
          <button class="pill" id="addCal" type="button" data-text="event.calendarButton"></button>
        </div>
      </div>
    </section>

    <!-- ============ THE EVENING ============ -->
    <section class="paper-sec" data-section="schedule">
      <h2 class="script title ink reveal" data-text="schedule.title"></h2>
      <p class="subtitle ink-soft reveal" data-text="schedule.subtitle"></p>
      <ol class="timeline" id="timeline"></ol>
      <div class="sched-note reveal" id="schedNote">
        <svg class="sched-note__orn" viewBox="0 0 120 14" aria-hidden="true"><path d="M2 7h44M74 7h44" /><path d="M60 2c-3 3-3 7 0 10 3-3 3-7 0-10Z" /><circle cx="51" cy="7" r="1.6"/><circle cx="69" cy="7" r="1.6"/></svg>
        <p class="sched-note__text" data-text="schedule.note"></p>
      </div>
    </section>

    <!-- ============ WHERE ============ -->
    <section class="dark-sec where" data-section="venue">
      <h2 class="script title reveal" data-text="venue.title"></h2>
      <figure class="arch reveal" id="arch"><img data-src="venue.image" alt=""></figure>
      <h3 class="where__name reveal" data-text="venue.name"></h3>
      <p class="where__address reveal" data-text="venue.address"></p>
      <a class="pill reveal" id="mapsBtn" target="_blank" rel="noopener" data-text="venue.button"></a>
      <div class="where__map reveal" id="mapBox"><iframe id="mapFrame" title="Map" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div>
    </section>

    <!-- ============ DRESS CODE ============ -->
    <section class="silk-sec dress" data-section="dress">
      <div class="silk-sec__bg" data-bg="dress.background"></div>
      <div class="dress__inner">
        <h2 class="script title reveal" data-text="dress.title"></h2>
        <p class="dress__text reveal" data-text="dress.text"></p>
      </div>
    </section>

    <!-- ============ A FEW WISHES ============ -->
    <section class="paper-sec" data-section="wishes">
      <h2 class="script title ink reveal" data-text="wishes.title"></h2>
      <div class="wishes" id="wishList"></div>
    </section>

    <!-- ============ QUESTIONS ============ -->
    <section class="dark-sec" data-section="faq">
      <h2 class="script title reveal" data-text="faq.title"></h2>
      <div class="faq" id="faqList"></div>
    </section>

    <!-- ============ RSVP ============ -->
    <section class="rsvp" data-section="rsvp">
      <div class="rsvp__bg" data-bg="rsvp.background"></div>
      <div class="rsvp__inner">
        <h2 class="script title reveal" data-text="rsvp.title"></h2>
        <p class="body-text reveal" data-text="rsvp.text"></p>
        <p class="rsvp__deadline caps reveal" data-text="rsvp.deadline"></p>
        <form class="rsvp__form reveal" id="rsvpForm" novalidate>
          <input class="field" name="name" required autocomplete="name" data-ph="rsvp.namePlaceholder">
          <div class="choice" role="radiogroup">
            <label><input type="radio" name="answer" value="accept" required><span data-text="rsvp.accept"></span></label>
            <label><input type="radio" name="answer" value="decline"><span data-text="rsvp.decline"></span></label>
          </div>
          <input class="field" name="guests" type="number" min="1" max="20" inputmode="numeric" id="guestsField" data-ph="rsvp.guestsPlaceholder">
          <textarea class="field" name="message" rows="2" data-ph="rsvp.messagePlaceholder"></textarea>
          <button class="pill" type="submit" data-text="rsvp.button"></button>
          <p class="rsvp__status" id="rsvpStatus" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>

    <!-- ============ UNTIL WE MEET ============ -->
    <section class="dark-sec until" id="until" data-section="closing">
      <h2 class="script title reveal" data-text="closing.title"></h2>
      <div class="countdown reveal" id="countdown">
        <div><b id="cdD">0</b><span data-text="closing.days"></span></div>
        <i>:</i>
        <div><b id="cdH">0</b><span data-text="closing.hours"></span></div>
        <i>:</i>
        <div><b id="cdM">0</b><span data-text="closing.minutes"></span></div>
        <i class="cd-sec">:</i>
        <div class="cd-sec"><b id="cdS">0</b><span data-text="closing.seconds"></span></div>
      </div>
      <p class="until__love reveal" data-text="closing.withLove"></p>
      <p class="until__names reveal">
        <span class="script" data-text="hero.name1"></span>
        <span class="until__amp" data-text="hero.ampersand"></span>
        <span class="script" data-text="hero.name2"></span>
      </p>
    </section>
    <footer class="foot" data-text="closing.footer"></footer>
  </main>

  <!-- Music -->
  <audio id="music" loop preload="auto"></audio>
  <button class="music-btn" id="musicBtn" type="button" aria-label="Pause music" hidden>
    <span class="music-btn__bars"><i></i><i></i><i></i><i></i></span>
  </button>

  <!-- config.js is always loaded fresh so published changes show at once -->
  <script>document.write('<script src="config.js?t=' + Date.now() + '"><\/script>');</script>
  <script src="assets/js/store.js?v=20261127b"></script>
  <script src="assets/js/invite.js?v=20261127b"></script>
</body>
</html>
